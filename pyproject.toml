[project]
name = "seznam-mail-mcp"
version = "1.0.0"
description = "Self-hosted multi-user MCP server for Seznam.cz e-mail"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "mcp>=2.3,<3",
    "imapclient>=3.0",
    "cryptography>=42",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "pypdf>=5",
    "pypdfium2>=4",
    "pillow>=10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
seznam-mail-mcp = "seznam_mail_mcp.server:main"
seznam-mail-mcp-db = "seznam_mail_mcp.db:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seznam_mail_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
